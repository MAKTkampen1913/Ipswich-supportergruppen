<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotball Mål Tracker</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, sans-serif;
  background: #002b5c;
  color: white;
}

.header {
  background: linear-gradient(90deg,#003A8F,#ED1C24);
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.card {
  background: #003A8F;
  margin: 10px;
  padding: 10px;
  border-radius: 10px;
}

button {
  padding: 8px;
  margin: 4px;
  border: none;
  border-radius: 6px;
}

.primary {
  background: #ED1C24;
  color: white;
}

input {
  padding: 6px;
  margin: 4px;
}

table {
  width: 100%;
  background: white;
  color: black;
  border-collapse: collapse;
}

th {
  background: red;
  color: white;
}

td, th {
  padding: 6px;
  text-align: center;
}

</style>
</head>

<body>

<div class="header">⚽ Goal Tracker</div>

<div class="card">
  <button class="primary" onclick="exportToExcel()">⬇ Excel</button><br>

  <input id="player" placeholder="Spiller">
  <button onclick="addPlayer()">+ Spiller</button><br>

  <input id="match" placeholder="Kamp">
  <button onclick="addMatch()">+ Kamp</button>
</div>

<div class="card">
<table>
  <thead>
    <tr id="headerRow">
      <th>Spiller</th>
    </tr>
  </thead>
  <tbody id="body"></tbody>
</table>
</div>

<script>

let players = JSON.parse(localStorage.getItem("players")||"[]");
let matches = JSON.parse(localStorage.getItem("matches")||"[]");
let goals = JSON.parse(localStorage.getItem("goals")||"{}");

function save(){
  localStorage.setItem("players", JSON.stringify(players));
  localStorage.setItem("matches", JSON.stringify(matches));
  localStorage.setItem("goals", JSON.stringify(goals));
}

function render(){
  let header = document.getElementById("headerRow");
  let body = document.getElementById("body");

  header.innerHTML = "<th>Spiller</th>";

  matches.forEach((m,i)=>{
    header.innerHTML += `<th>${m} <button onclick="removeMatch(${i})">x</button></th>`;
  });

  header.innerHTML += "<th>Total</th>";

  body.innerHTML = "";

  players.forEach((p,i)=>{
    let row = `<tr><td>${p} <button onclick="removePlayer(${i})">x</button></td>`;
    let total = 0;

    matches.forEach(m=>{
      let key = p+"-"+m;
      let val = goals[key]||0;
      total += val;

      row += `<td><input type="number" value="${val}" onchange="setGoal('${p}','${m}',this.value)"></td>`;
    });

    row += `<td>${total}</td></tr>`;
    body.innerHTML += row;
  });
}

function setGoal(p,m,v){
  goals[p+"-"+m] = parseInt(v)||0;
  save();
  render();
}

function addPlayer(){
  let val = document.getElementById("player").value;
  if(val){
    players.push(val);
    save();
    render();
  }
}

function addMatch(){
  let val = document.getElementById("match").value;
  if(val){
    matches.push(val);
    save();
    render();
  }
}

function removePlayer(i){
  players.splice(i,1);
  save();
  render();
}

function removeMatch(i){
  matches.splice(i,1);
  save();
  render();
}

function exportToExcel(){
  let csv = "Spiller," + matches.join(",") + ",Totalt\n";

  players.forEach(p=>{
    let row = p;
    let total = 0;

    matches.forEach(m=>{
      let v = goals[p+"-"+m]||0;
      row += ","+v;
      total += v;
    });

    row += ","+total;
    csv += row+"\n";
  });

  let blob = new Blob([csv]);
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "data.csv";
  a.click();
}

render();

</script>

</body>
</html>
